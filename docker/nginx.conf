# 词光 Word Atlas · 容器内 nginx 站点
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json application/manifest+json image/svg+xml;

    # 入口与 Service Worker 不缓存，发版即刻生效
    location = /index.html { add_header Cache-Control "no-cache"; }
    location = /sw.js { add_header Cache-Control "no-cache"; }

    # 带 hash 的构建产物
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 插画与音频：大文件长缓存，保留 Range
    location ~* ^/atlas/(img|thumb|audio)/ {
        expires 180d;
        add_header Cache-Control "public";
        add_header Accept-Ranges bytes;
    }

    # 词库索引与词条：短缓存，换词库不用清浏览器缓存
    location ^~ /atlas/entries/ { expires 1d; }
    location = /atlas/index.json {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    location ~* ^/(brand|sfx)/ { expires 30d; }

    location / {
        try_files $uri $uri/ /index.html;
    }

    error_page 404 =200 /index.html;
    access_log off;
}
